version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: ${DOCKER_USER}/myapp:${TAG:-latest}
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery:
    image: ${DOCKER_USER}/myapp:${TAG:-latest}
    build: .
    command: celery -A config worker -B --loglevel=info
    env_file:
      - .env
    volumes:
      - media_volume:/app/mediafiles
    depends_on:
      - redis
      - db
    restart: unless-stopped

  nginx:
    image: ${DOCKER_USER}/myapp-nginx:${TAG:-latest}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - web
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
