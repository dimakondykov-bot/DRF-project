
name: Django CI

on: [ push, pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 . --exclude=.venv,venv,.git,__pycache__,*migrations* --max-line-length=120

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "temporary_secret_key_for_github_actions_testing"
      ENGINE: "django.db.backends.sqlite3"
      NAME: "test_db"
      USER: "test_user"
      DB_PASSWORD: "test_password"
      HOST: "127.0.0.1"
      PORT: "5432"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/0"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/0"
      TELEGRAM_TOKEN_TG: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }} -pip-${{ hashFiles('**/requirements.txt')}}
          restore-keys: ${{ runner.os }}-pip_

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrate
        run: python manage.py migrate


      - name: Run tests
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCEES_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF' 
          set -e # команда заставляет немедленно завершить работу, если будет ошибка
          
          cd ${{ secrets.DEPLOY_DIR }}
          
          git pull origin ${{ github.ref_name }}
          
          echo ${{ secrets.DOCKER_HUB_ACCEES_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
          
          # 1. Скачиваем образ
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} 
          
          # 2. Передаем TAG внутрь docker-compose при перезапуске
          export TAG=${{ github.sha }}
          export DOCKER_USER=${{ secrets.DOCKER_HUB_USERNAME }}
          
          docker-compose down
          
          # Теперь compose подставит эти переменные
          docker-compose up -d --build
          
          # 3. Автоматически запускаем миграции внутри контейнера 'web' сразу после запуска сайта
          docker-compose exec -T web python manage.py migrate
          
          docker-compose ps
          docker image prune -f
          EOF

